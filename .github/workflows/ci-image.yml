# The image of the check job: ci/Dockerfile, OpenUSD in /opt/USD and
# clang-repl 23, pushed to ghcr.io/farhatnadim/openusd-tutorial-ci. A person
# starts this workflow (Actions, ci-image, Run workflow); a check run never
# builds OpenUSD. The plan is plans/objective-1-ci-openusd-image.md (issue #5).
#
# The tag is usd-<OpenUSD commit, 9 characters, or the tag>-clang23, and it
# is written one time: the run stops when the tag exists. A new OpenUSD
# commit or a new clang gets a new tag, and check.yml moves to it by pull
# request.

name: ci-image

on:
  workflow_dispatch:
    inputs:
      openusd_ref:
        description: The OpenUSD commit or tag (github.com/PixarAnimationStudios/OpenUSD)
        required: true
        default: 6792941c5d5b42778e6875c5ed5a3279e6936981

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: The image name and tag
        id: tag
        env:
          REF: ${{ inputs.openusd_ref }}
        run: |
          case "$REF" in
            ''|*[!0-9a-f]*) short="$REF" ;;
            *)              short="${REF:0:9}" ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-ci:usd-${short}-clang23" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The tag is new
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE exists: a tag is written one time"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ci
          build-args: OPENUSD_REF=${{ inputs.openusd_ref }}
          tags: ${{ steps.tag.outputs.image }}
          provenance: false
          push: true

      - name: The image runs clang-repl and has OpenUSD
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker run --rm "$IMAGE" sh -c 'clang-repl-23 --version && cat /opt/USD/openusd-ref && test -f /opt/USD/pxrConfig.cmake && gh --version'
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
