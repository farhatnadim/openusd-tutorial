name: Bug
description: A lesson, the build or the REPL launcher does something wrong. The title is one sentence that states the fact.
labels: [bug]
projects: ["farhatnadim/14"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The command or the lesson, what it printed, and what it should have printed. A transcript beats a description.
      render: text
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Lesson or file
      placeholder: nvidia_tutorials/08_xform/main.cpp
    validations:
      required: true
